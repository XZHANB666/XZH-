<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联系我们 - 我的个人网站</title>
  <meta name="description" content="联系我：发送消息或合作邀约。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="contact-container">
    <h1 style="color:#fff; margin-bottom:12px;">联系我</h1>
    <p style="color:rgba(255,255,255,0.75); margin-bottom:18px;">填写下面的表单，发送消息给我（示例使用 Formspree；请替换为你的 action URL）。</p>

    <!-- 表单示例：使用 Formspree（替换 YOUR_FORMSPREE_ID）或改为你自己的后端地址 -->
    <!-- 1) 在 Formspree.io 注册并创建表单，获取 action URL，例如 https://formspree.io/f/xxxxxxxx -->
    <!-- 2) 将 form 的 action 替换为上面的 URL，表单就能把邮件发送到你的邮箱 -->

    <form class="contact-form" method="POST" action="https://formspree.io/f/YOUR_FORMSPREE_ID">
      <input type="text" name="name" placeholder="你的名字" required />
      <input type="email" name="email" placeholder="你的邮箱" required />
      <textarea name="message" rows="6" placeholder="写下你的信息" required></textarea>
      <button type="submit">发送</button>
    </form>

    <p style="color:rgba(255,255,255,0.6); margin-top:18px;">或者发邮件到：<a href="mailto:your-email@example.com" style="color:#fff;">your-email@example.com</a></p>

    <p style="color:rgba(255,255,255,0.4); margin-top:30px;">返回 <a href="/" style="color:#fff;">首页</a></p>
  </main>
</body>
</html>
